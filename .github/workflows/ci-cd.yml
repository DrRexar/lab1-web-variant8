name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # =====================================================================
  # 1. ТЕСТЫ — выполняются в облаке GitHub на ubuntu-latest
  # =====================================================================
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      RECAPTCHA_PUBLIC_KEY:  6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
      RECAPTCHA_PRIVATE_KEY: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
      SECRET_KEY: ci-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application test (gunicorn + client.py)
        run: |
          chmod +x flaskapp/st.sh
          cd flaskapp
          ./st.sh

  # =====================================================================
  # 2. ДЕПЛОЙ — выполняется на self-hosted runner внутри Windows 11 ВМ
  #    Путь проекта: C:\Users\Daniil\Desktop\Tusur\lab1_web
  # =====================================================================
  deploy:
    name: Deploy on Windows VM
    needs: test
    if: github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: self-hosted
    steps:
      - name: Show runner info
        shell: powershell
        run: |
          Write-Host "Runner OS:   $env:RUNNER_OS"
          Write-Host "Runner Name: $env:RUNNER_NAME"

      - name: Pull latest code
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "C:\Users\Daniil\Desktop\Tusur\lab1_web"
          git fetch --all
          git reset --hard origin/main
          git log -1 --oneline

      - name: Update Python dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "C:\Users\Daniil\Desktop\Tusur\lab1_web"
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Restart service and check health
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          C:\nssm\nssm.exe restart Lab1Service
          Start-Sleep -Seconds 4
          $r = Invoke-WebRequest -UseBasicParsing -Uri http://localhost:8080/health -TimeoutSec 15
          Write-Host "HTTP $($r.StatusCode): $($r.Content)"
          if ($r.Content -notmatch '"status"\s*:\s*"ok"') {
            Write-Error "Healthcheck failed: $($r.Content)"
            exit 1
          }
          Write-Host "DEPLOY OK"

      - name: Show service status
        shell: powershell
        run: |
          C:\nssm\nssm.exe status Lab1Service